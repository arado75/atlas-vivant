id: wind_patterns
name: Vents planetaires
version: 0.1.0
domain: atmosphere
status: core
description: Synthese simulee des grands flux de vents et jet streams pour le MVP.
sources:
  - type: dataset
    name: Simulated atmospheric circulation feed
    reliability: medium
update_frequency: hourly
spatial_resolution: global
temporal_resolution: monthly
observables:
  - velocity
  - direction
relations:
  upstream:
    - node: solar_radiation
      type: robust_causality
      confidence: 0.91
      delay: 0-3 jours
  downstream:
    - node: surface_temperature
      type: probable_causality
      confidence: 0.69
      delay: 1-3 semaines
    - node: ocean_currents
      type: probable_causality
      confidence: 0.76
      delay: 1-6 semaines
visualization:
  mode: flow-lines
  color_scale: cyan
maturity:
  stage: integration
notes:
  - Jeu de donnees simule pour le MVP.
